[package]
name = "pihole-exporter"
version = "1.2.0"
edition = "2021"
description = "A Prometheus exporter for Pi-hole's ad blocker"
license = "MIT"
readme = "README.md"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["env", "derive"] }
futures = "0.3"
humantime = "2"
once_cell = "1"
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.40", default-features = false, features = ["std", "ring", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
